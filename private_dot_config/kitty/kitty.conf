# vim:fileencoding=utf-8:ft=kitty:foldmethod=marker
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  kitty                                                              │
# │  Full documented defaults live in kitty.conf.reference              │
# │  Previous config saved as kitty.conf.pre-refresh.bak                │
# └─────────────────────────────────────────────────────────────────────┘


# ═══════════════════════════════════════════════════════════════════════
# FONT                                                        (unchanged)
# ═══════════════════════════════════════════════════════════════════════

font_family      family="Iosevka Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        19.0

# Tiny typographic polish: crisper underlines (undercurls, spell errors,
# hyperlinks) and a hair of extra line height so 19pt Iosevka breathes.
modify_font underline_position   130%
modify_font underline_thickness  110%
modify_font cell_height          102%

# Iosevka's default ships without ligatures, but if you ever swap to the
# ligature variant this keeps them from garbling the text under the cursor.
disable_ligatures cursor


# ═══════════════════════════════════════════════════════════════════════
# TEXT RENDERING — the "sharp" knob
# ═══════════════════════════════════════════════════════════════════════

# macOS default is `platform` (== 1.7 30) which gamma-fattens glyphs and
# reads soft/blurry. 1.0 0 renders thin and razor sharp.
#   too thin?   -> try `1.3 15`, then `platform`
#   too heavy?  -> keep 1.0 0 and leave macos_thicken_font at 0
text_composition_strategy 1.0 0
macos_thicken_font 0.0

# Wide-gamut rendering on Apple displays. Catppuccin's pastels get
# noticeably more saturated instead of being clamped to sRGB.
macos_colorspace displayp3


# ═══════════════════════════════════════════════════════════════════════
# WINDOW & CHROME
# ═══════════════════════════════════════════════════════════════════════

hide_window_decorations titlebar-only
macos_show_window_title_in    none
macos_option_as_alt           yes
macos_quit_when_last_window_closed yes
# (your old `macos_text_input_caret disabled` was not a real kitty option —
#  it was being silently ignored, so dropping it changes nothing)
placement_strategy            center

background_opacity          0.80
dynamic_background_opacity  yes
# The single biggest visual upgrade on macOS: real vibrancy behind the
# translucency instead of a flat see-through pane.
background_blur             64

window_padding_width         10
# A solo window gets extra room; splits tighten back up to 10 automatically.
single_window_padding_width  16
window_margin_width          0

# Hairline splits + dimmed inactive panes = obvious focus without borders
# shouting at you.
window_border_width    1pt
draw_minimal_borders   yes
inactive_text_alpha    0.75

enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid

# 120Hz-friendly. Bump repaint_delay back to 10 if you notice extra fan noise.
sync_to_monitor yes
repaint_delay   8
input_delay     1


# ═══════════════════════════════════════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════════════════════════════════════

cursor_beam_thickness         1.5
cursor_trail                  3
cursor_trail_decay            0.08 0.35
cursor_trail_start_threshold  2
# Eased fade rather than a hard on/off blink.
cursor_blink_interval         0.5 ease-in-out
cursor_stop_blinking_after    15.0
mouse_hide_wait               3.0


# ═══════════════════════════════════════════════════════════════════════
# TAB BAR
# ═══════════════════════════════════════════════════════════════════════
#
# NOTE: your old config set `tab_bar_style powerline` at the top and then
# `tab_bar_style separator` further down — last one wins, so the powerline
# + slanted settings were silently dead. Powerline is restored here.

tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        1
tab_bar_margin_width    0.0
# Floats the strip off the top edge and off the content below it.
tab_bar_margin_height   6.0 6.0
tab_bar_margin_color    none

tab_title_max_length    28
active_tab_font_style   bold
inactive_tab_font_style normal

# Dim index, then the title, then a Nerd Font glyph when the tab holds
# more than one window. `` is nf-fa-columns, `` is nf-fa-bell.
tab_title_template        "{fmt.fg._585B70}{index}{fmt.fg.tab} {bell_symbol}{activity_symbol}{title}{fmt.fg._585B70}{'  ' if num_windows > 1 else ''}"
active_tab_title_template "{fmt.fg._45475A}{index}{fmt.fg.tab} {bell_symbol}{title}{fmt.fg._45475A}{'  ' if num_windows > 1 else ''}"

# Your old `tab_activity_symbol "L"` was a mangled glyph — this is a clean
# filled dot for "something printed in a background tab".
tab_activity_symbol "● "
bell_on_tab         " "


# ═══════════════════════════════════════════════════════════════════════
# BELL
# ═══════════════════════════════════════════════════════════════════════

enable_audio_bell    no
window_alert_on_bell yes
visual_bell_duration 0.15 ease-out
visual_bell_color    #F9E2AF

# Desktop notification when a command that ran >10s finishes in a window
# you aren't looking at. Needs shell integration (enabled below).
notify_on_cmd_finish unfocused 10.0


# ═══════════════════════════════════════════════════════════════════════
# URLS, SELECTION, SCROLLBACK
# ═══════════════════════════════════════════════════════════════════════

detect_urls          yes
url_style            curly
underline_hyperlinks hover
undercurl_style      thin-sparse

strip_trailing_spaces smart
# Warns before pasting multi-line text at a prompt and quotes bare URLs.
paste_actions quote-urls-at-prompt,confirm

scrollback_lines               100000
scrollback_pager_history_size  128
wheel_scroll_multiplier        3.0

# kitty 0.47 ships a real overlay scrollbar. Styled as a slim rounded
# mauve pill that only appears while scrolling or on hover — macOS-native
# feel, zero permanent chrome. (`scrollback_indicator_opacity` is the
# deprecated predecessor of these.)
scrollbar                     scrolled-and-hovered
scrollbar_width               0.4
scrollbar_hover_width         0.7
scrollbar_radius              0.2
scrollbar_gap                 0.15
scrollbar_handle_color        #CBA6F7
scrollbar_handle_opacity      0.55
scrollbar_track_color         #45475A
scrollbar_track_hover_opacity 0.18


# ═══════════════════════════════════════════════════════════════════════
# SHELL & REMOTE CONTROL
# ═══════════════════════════════════════════════════════════════════════

shell_integration enabled
confirm_os_window_close -1

# socket-only = scriptable via `kitten @ --to $KITTY_LISTEN_ON ...`, but
# programs printing escape codes into the terminal can't drive it.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Left as you had it. Switching to `term kitty` unlocks kitty's full
# terminfo (styled underlines, text-sizing protocol) at the cost of
# needing `kitten ssh` on remote boxes that lack kitty's terminfo.
term xterm-256color


# ═══════════════════════════════════════════════════════════════════════
# KEYBINDINGS
# ═══════════════════════════════════════════════════════════════════════

# ── yours, untouched ───────────────────────────────────────────────────
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ── suggestions: delete any you don't want ─────────────────────────────

# Splits. cmd+d / cmd+shift+d are unbound in kitty by default and match
# iTerm2 muscle memory. New pane opens in the current directory.
map cmd+d              launch --location=vsplit --cwd=current
map cmd+shift+d        launch --location=hsplit --cwd=current
# Zoom the focused split to fill the tab, press again to restore.
map cmd+shift+enter    toggle_layout stack
map cmd+alt+left       neighboring_window left
map cmd+alt+right      neighboring_window right
map cmd+alt+up         neighboring_window up
map cmd+alt+down       neighboring_window down

# New tab that inherits the current directory (plain cmd+t does not).
map cmd+shift+t        new_tab_with_cwd
map cmd+shift+comma    move_tab_backward
map cmd+shift+period   move_tab_forward
map cmd+shift+i        set_tab_title

# The hints kitten — labels every match on screen, you type the label.
# This is the feature most people never discover and then can't live
# without. `--program -` pastes into the terminal instead of opening.
map cmd+shift+e        open_url_with_hints
map cmd+shift+p>f      kitten hints --type path       --program -
map cmd+shift+p>l      kitten hints --type line       --program -
map cmd+shift+p>w      kitten hints --type word       --program -
map cmd+shift+p>h      kitten hints --type hash       --program -
map cmd+shift+p>n      kitten hints --type linenum
map cmd+shift+p>y      kitten hints --type hyperlink

# Shell-integration superpowers: dump the *last command's output* into
# your pager, or the whole scrollback.
map cmd+shift+g        show_last_command_output
map cmd+shift+h        show_scrollback

# Live opacity nudging (needs dynamic_background_opacity, set above).
map cmd+alt+plus       set_background_opacity +0.05
map cmd+alt+minus      set_background_opacity -0.05
map cmd+alt+0          set_background_opacity default

# Type any emoji/glyph by name or codepoint.
map cmd+shift+u        kitten unicode_input
# Type once, send to every split in the tab. Press again to stop.
map cmd+alt+b          launch --allow-remote-control kitten broadcast
# Live theme browser — writes current-theme.conf for you.
map cmd+alt+t          kitten themes


# ═══════════════════════════════════════════════════════════════════════
# COLORS
# ═══════════════════════════════════════════════════════════════════════

include current-theme.conf
